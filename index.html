<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#104b3d"><title>پول‌یار | مدیریت هزینه</title>
<style>
:root{--green:#104b3d;--green2:#176b53;--mint:#e2f4eb;--bg:#f3f6f4;--ink:#172a23;--muted:#74827b;--red:#c95145;--line:#e5ebe7;--white:#fff;--gold:#d49a32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Noto Sans Arabic",sans-serif;font-size:14px;padding-bottom:84px}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:600px;margin:auto;min-height:100vh}.top{background:var(--green);color:white;padding:24px 20px 26px;border-radius:0 0 28px 28px}.brand{display:flex;align-items:center;justify-content:space-between}.brandleft{display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;border-radius:14px;background:#ffffff1f;display:grid;place-items:center;font-size:23px}.brand h1{font-size:20px;margin:0 0 4px}.brand small{color:#c9e2d7}.pill{border:1px solid #ffffff45;border-radius:20px;padding:7px 10px;font-size:11px;color:#d7eee4}.label{color:#c9e2d7;margin-top:25px;font-size:12px}.balance{font-size:31px;font-weight:800;margin:8px 0 20px;letter-spacing:-1px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#ffffff14;border:1px solid #ffffff17;border-radius:16px;padding:13px}.stat .stlabel{font-size:12px;color:#d5e9df;display:flex;gap:6px;align-items:center}.stat strong{display:block;font-size:17px;margin-top:9px}.stat .up{color:#a7edc7}.stat .down{color:#ffd0c8}.content{padding:18px 15px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 13px}.sectionhead h2{font-size:16px;margin:0}.textbtn{background:transparent;color:var(--green2);font-weight:bold;padding:8px}.card{background:white;border-radius:19px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #102b1b06}.quick{display:grid;grid-template-columns:1fr 1fr;gap:11px}.quick button{padding:14px;border-radius:16px;text-align:right;display:flex;align-items:center;gap:10px;font-weight:bold}.quick .expense{background:#fff0ed;color:var(--red)}.quick .income{background:var(--mint);color:var(--green2)}.quick .qicon{width:34px;height:34px;border-radius:12px;background:#ffffffba;display:grid;place-items:center;font-size:20px}.tx{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.txicon{width:42px;height:42px;border-radius:14px;background:#f1f5f2;display:grid;place-items:center;font-size:19px;flex-shrink:0}.txmain{flex:1;min-width:0}.txmain b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.txmain small{display:block;color:var(--muted);margin-top:5px;font-size:11px}.txamount{font-weight:bold;white-space:nowrap;font-size:13px}.positive{color:var(--green2)}.negative{color:var(--red)}.empty{text-align:center;color:var(--muted);padding:25px 10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom))}.nav{width:min(600px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{background:transparent;color:#7d8982;border-radius:13px;padding:8px 2px;font-size:11px}.nav button span{display:block;font-size:19px;margin-bottom:4px}.nav button.active{background:var(--mint);color:var(--green);font-weight:bold}.page-title{font-size:21px;margin:6px 0 4px}.sub{color:var(--muted);font-size:12px;margin:0 0 18px}.field{margin-bottom:14px}.field label{display:block;font-weight:bold;margin-bottom:8px;font-size:12px}.field input,.field select{width:100%;border:1px solid #dce5df;border-radius:13px;padding:13px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--green2)}.type-toggle{display:grid;grid-template-columns:1fr 1fr;background:#edf2ee;padding:4px;border-radius:14px;margin-bottom:18px}.type-toggle button{padding:11px;border-radius:11px;background:transparent;color:var(--muted);font-weight:bold}.type-toggle button.active{background:white;color:var(--green);box-shadow:0 2px 8px #0000000b}.primary{width:100%;padding:14px;border-radius:14px;background:var(--green);color:white;font-weight:bold}.secondary{padding:10px 13px;border-radius:12px;background:#edf5f0;color:var(--green);font-weight:bold}.danger{background:#fff0ed;color:var(--red)}.budgetrow{margin:15px 0}.budgethead{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:9px}.track{height:8px;background:#edf1ee;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--green2);border-radius:20px}.fill.over{background:var(--red)}.muted{color:var(--muted)}.reportgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.reportbox{padding:15px;border-radius:16px;background:#f3f7f4}.reportbox small{color:var(--muted)}.reportbox strong{display:block;font-size:17px;margin-top:8px}.barrow{display:grid;grid-template-columns:80px 1fr 70px;gap:8px;align-items:center;margin:13px 0;font-size:11px}.bar{height:8px;background:#edf1ee;border-radius:20px;overflow:hidden}.bar i{height:100%;display:block;background:var(--green2);border-radius:20px}.modalback{position:fixed;inset:0;background:#10251dcc;z-index:30;display:none;align-items:flex-end;justify-content:center}.modalback.show{display:flex}.modal{background:var(--bg);width:min(600px,100%);padding:22px 18px calc(22px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:18px}.close{background:#e6ede8;border-radius:50%;width:34px;height:34px;font-size:20px;color:var(--green)}.budget-item{display:flex;align-items:center;gap:10px}.budget-item .txmain{flex:1}.budget-item button{padding:8px 10px;border-radius:10px}.notice{background:#fff7e6;color:#85631e;padding:12px;border-radius:12px;font-size:12px;line-height:1.8}.settingsline{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);gap:10px}.settingsline:last-child{border:0}.settingsline b{font-size:13px}.settingsline small{display:block;color:var(--muted);margin-top:5px}.toast{position:fixed;bottom:90px;left:18px;right:18px;max-width:560px;margin:auto;background:#193b30;color:white;padding:13px 16px;border-radius:13px;z-index:40;display:none;text-align:center}.toast.show{display:block}@media(min-width:500px){.content{padding:22px}.top{padding:28px 24px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="brandleft"><div class="logo">◈</div><div><h1>پول‌یار</h1><small>مدیریت ساده پول تو</small></div></div><span class="pill">● آفلاین</span></div>
 <div class="label">موجودی کل</div><div class="balance" id="balance">۰ ؋</div>
 <div class="stats"><div class="stat"><div class="stlabel"><span class="up">↙</span> مجموع درآمد</div><strong class="up" id="income">۰ ؋</strong></div><div class="stat"><div class="stlabel"><span class="down">↗</span> مجموع مصارف</div><strong class="down" id="expenses">۰ ؋</strong></div></div>
</header>
<main class="content" id="content"></main>
<nav class="bottom"><div class="nav">
<button class="active" data-page="home"><span>⌂</span>خانه</button><button data-page="transactions"><span>⇄</span>تراکنش‌ها</button><button data-page="budgets"><span>▤</span>بودجه‌بندی</button><button data-page="reports"><span>◔</span>گزارش‌ها</button>
</div></nav>
</div>
<div class="modalback" id="modalback"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const faNum=n=>new Intl.NumberFormat('fa-AF',{maximumFractionDigits:0}).format(Math.round(Number(n)||0));
const money=n=>faNum(n)+' ؋';
const cats={expense:['غذا و مواد غذایی','ترانسپورت','خانه و کرایه','صحت و دوا','خرید و پوشاک','آموزش','تفریح','قبض‌ها','سایر'],income:['معاش','کار آزاد','تجارت','هدیه','سایر']};
const icons={'غذا و مواد غذایی':'🍲','ترانسپورت':'🚕','خانه و کرایه':'🏠','صحت و دوا':'💊','خرید و پوشاک':'🛍️','آموزش':'📚','تفریح':'🎯','قبض‌ها':'🧾','سایر':'◈','معاش':'💼','کار آزاد':'💻','تجارت':'🏪','هدیه':'🎁'};
let state={transactions:[],budgets:{},page:'home',type:'expense',filter:'all',month:today().slice(0,7)};
try{const saved=localStorage.getItem('poolyar_v1');if(saved){const parsed=JSON.parse(saved);state={...state,...parsed,page:'home'}}}catch(e){}
function save(){try{localStorage.setItem('poolyar_v1',JSON.stringify({transactions:state.transactions,budgets:state.budgets,month:state.month}))}catch(e){toast('ذخیره‌سازی ممکن نشد. فضای موبایل را بررسی کن.')}}
function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}
const monthTx=()=>state.transactions.filter(t=>t.date.startsWith(state.month));
const sum=(arr,type)=>arr.filter(t=>t.type===type).reduce((a,t)=>a+t.amount,0);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function header(){let inc=sum(state.transactions,'income'),exp=sum(state.transactions,'expense');$('#balance').textContent=money(inc-exp);$('#income').textContent=money(inc);$('#expenses').textContent=money(exp)}
function txHtml(t){return `<div class="tx"><div class="txicon">${icons[t.category]||'◈'}</div><div class="txmain"><b>${esc(t.title)}</b><small>${esc(t.category)} · ${faNum(Number(t.date.slice(8,10)))}-${faNum(Number(t.date.slice(5,7)))}-${faNum(t.date.slice(0,4))}</small></div><div class="txamount ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${money(t.amount)}</div><button class="textbtn" aria-label="حذف" data-delete="${t.id}">×</button></div>`}
function empty(msg){return `<div class="empty"><div style="font-size:30px;margin-bottom:10px">◌</div>${msg}</div>`}
function home(){let recent=[...state.transactions].sort((a,b)=>b.created-a.created).slice(0,5),mt=monthTx(),spent=sum(mt,'expense'),budget=Object.values(state.budgets).reduce((a,b)=>a+Number(b),0);
return `<div class="sectionhead"><h2>سلام! 👋</h2><span class="muted">${new Date().toLocaleDateString('fa-AF',{year:'numeric',month:'long',day:'numeric'})}</span></div><div class="quick"><button class="expense" data-action="add-expense"><span class="qicon">−</span><span>ثبت مصرف</span></button><button class="income" data-action="add-income"><span class="qicon">＋</span><span>ثبت درآمد</span></button></div><div class="sectionhead" style="margin-top:24px"><h2>خلاصه این ماه</h2><button class="textbtn" data-page="reports">گزارش کامل ←</button></div><div class="card"><div class="reportgrid"><div class="reportbox"><small>مصارف این ماه</small><strong>${money(spent)}</strong></div><div class="reportbox"><small>بودجه تعیین‌شده</small><strong>${money(budget)}</strong></div></div>${budget?`<div style="margin-top:15px"><div class="budgethead"><span>مصرف بودجه</span><b>${faNum(Math.round(spent/budget*100))}٪</b></div><div class="track"><div class="fill ${spent>budget?'over':''}" style="width:${Math.min(100,spent/budget*100)}%"></div></div></div>`:''}</div><div class="sectionhead"><h2>تراکنش‌های اخیر</h2><button class="textbtn" data-page="transactions">همه ←</button></div><div class="card">${recent.length?recent.map(txHtml).join(''):empty('هنوز تراکنشی ثبت نکرده‌ای. اولین مورد را اضافه کن.')}</div><div class="notice">🔒 اطلاعات تو فقط در همین موبایل ذخیره می‌شود و برای کارکردن به اینترنت نیاز نداری.</div>`}
function monthControl(){return `<div class="field"><label>ماه گزارش</label><input type="month" id="monthpick" value="${state.month}"></div>`}
function transactions(){let arr=[...state.transactions].filter(t=>state.filter==='all'||t.type===state.filter).sort((a,b)=>b.created-a.created);return `<h2 class="page-title">تراکنش‌ها</h2><p class="sub">درآمدها و مصارف خود را مدیریت کن.</p><button class="primary" data-action="add-expense" style="margin-bottom:15px">＋ ثبت تراکنش جدید</button><div class="type-toggle"><button data-filter="all" class="${state.filter==='all'?'active':''}">همه</button><button data-filter="expense" class="${state.filter==='expense'?'active':''}">مصارف</button><button data-filter="income" class="${state.filter==='income'?'active':''}">درآمدها</button></div><div class="card">${arr.length?arr.map(txHtml).join(''):empty('تراکنشی با این فیلتر پیدا نشد.')}</div><div class="card"><button class="secondary" data-action="export">⇩ گرفتن نسخه پشتیبان</button> <button class="secondary" data-action="import">⇧ بازیابی اطلاعات</button></div>`}
function budgets(){let expenseCats=cats.expense;return `<h2 class="page-title">بودجه‌بندی</h2><p class="sub">برای هر دسته سقف مصرف ماهانه تعیین کن.</p>${monthControl()}<div class="card"><div class="sectionhead"><h2>بودجه‌های ماهانه</h2><button class="secondary" data-action="add-budget">＋ افزودن</button></div>${expenseCats.filter(c=>Number(state.budgets[c])>0).map(c=>{let spent=sum(monthTx().filter(t=>t.category===c),'expense'),limit=Number(state.budgets[c]);return `<div class="budgetrow"><div class="budgethead"><span>${icons[c]||''} ${esc(c)}</span><b>${money(spent)} / ${money(limit)}</b></div><div class="track"><div class="fill ${spent>limit?'over':''}" style="width:${Math.min(100,spent/limit*100)}%"></div></div><div style="text-align:left;margin-top:7px"><button class="textbtn" data-edit-budget="${esc(c)}">ویرایش</button><button class="textbtn" data-remove-budget="${esc(c)}">حذف</button></div></div>`}).join('')||empty('هنوز بودجه‌ای تعیین نشده است.')}<button class="primary" data-action="add-budget">تعیین بودجه جدید</button></div>`}
function reports(){let arr=monthTx(),inc=sum(arr,'income'),exp=sum(arr,'expense'),groups=cats.expense.map(c=>({c,v:sum(arr.filter(t=>t.category===c),'expense')})).filter(x=>x.v).sort((a,b)=>b.v-a.v),max=Math.max(1,...groups.map(x=>x.v));return `<h2 class="page-title">گزارش مالی</h2><p class="sub">تصویر روشن‌تری از وضعیت مالی خود داشته باش.</p>${monthControl()}<div class="reportgrid"><div class="card"><small class="muted">درآمد ماه</small><strong class="positive" style="display:block;font-size:18px;margin-top:8px">${money(inc)}</strong></div><div class="card"><small class="muted">مصارف ماه</small><strong class="negative" style="display:block;font-size:18px;margin-top:8px">${money(exp)}</strong></div><div class="card"><small class="muted">پس‌انداز ماه</small><strong style="display:block;font-size:18px;margin-top:8px">${money(inc-exp)}</strong></div><div class="card"><small class="muted">تعداد تراکنش</small><strong style="display:block;font-size:18px;margin-top:8px">${faNum(arr.length)}</strong></div></div><div class="card"><h3 style="margin:0 0 18px">مصارف بر اساس دسته</h3>${groups.length?groups.map(x=>`<div class="barrow"><span>${esc(x.c)}</span><div class="bar"><i style="width:${x.v/max*100}%"></i></div><b>${money(x.v)}</b></div>`).join(''):empty('در این ماه مصرفی ثبت نشده است.')}</div><div class="card"><button class="primary" data-action="export">⇩ صادر کردن نسخه پشتیبان</button></div>`}
function settings(){return `<h2 class="page-title">تنظیمات</h2><p class="sub">مدیریت اطلاعات و نسخه پشتیبان پول‌یار</p><div class="card"><div class="settingsline"><div><b>واحد پول</b><small>افغانی افغانستان (؋)</small></div><span>🇦🇫</span></div><div class="settingsline"><div><b>ذخیره‌سازی</b><small>محلی روی همین دستگاه، بدون اینترنت</small></div><span>🔒</span></div><div class="settingsline"><div><b>نسخه پشتیبان</b><small>برای انتقال یا محافظت از اطلاعات</small></div><button class="secondary" data-action="export">دریافت JSON</button></div><div class="settingsline"><div><b>بازیابی پشتیبان</b><small>بارگذاری فایل JSON پول‌یار</small></div><button class="secondary" data-action="import">انتخاب فایل</button></div></div><div class="notice">حذف داده‌های برنامه یا پاک‌کردن حافظه آن می‌تواند اطلاعات ذخیره‌شده را از بین ببرد. نسخه پشتیبان را در جای امن نگه‌دار.</div><div class="card" style="margin-top:14px"><button class="primary" style="background:#a63730" data-action="clear">پاک‌کردن تمام اطلاعات</button></div><input type="file" id="importfile" accept=".json,application/json" hidden>`}
function render(){header();$('#content').innerHTML=({home,transactions,budgets,reports,settings})[state.page]();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));}
function modal(content){$('#modal').innerHTML=content;$('#modalback').classList.add('show')}
function closeModal(){$('#modalback').classList.remove('show')}
function addTx(type){state.type=type;modal(`<div class="modalhead"><h2>${type==='income'?'ثبت درآمد جدید':'ثبت مصرف جدید'}</h2><button class="close" data-action="close">×</button></div><form id="txform"><div class="type-toggle"><button type="button" data-settype="expense" class="${type==='expense'?'active':''}">مصرف</button><button type="button" data-settype="income" class="${type==='income'?'active':''}">درآمد</button></div><div class="field"><label>عنوان تراکنش</label><input name="title" required maxlength="80" placeholder="مثلاً خرید مواد غذایی"></div><div class="field"><label>مبلغ (افغانی)</label><input name="amount" required type="number" min="1" step="1" inputmode="numeric" placeholder="مثلاً ۵۰۰"></div><div class="field"><label>دسته‌بندی</label><select name="category">${cats[type].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>تاریخ</label><input name="date" type="date" value="${today()}" required></div><button class="primary">ذخیره تراکنش</button></form>`)}
function addBudget(cat=''){modal(`<div class="modalhead"><h2>${cat?'ویرایش بودجه':'تعیین بودجه ماهانه'}</h2><button class="close" data-action="close">×</button></div><form id="budgetform"><div class="field"><label>دسته‌بندی</label><select name="category">${cats.expense.map(c=>`<option ${cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>سقف بودجه (افغانی)</label><input name="amount" type="number" min="1" step="1" required value="${cat?Number(state.budgets[cat])||'':''}" placeholder="مثلاً ۵۰۰۰"></div><button class="primary">ذخیره بودجه</button></form>`)}
function exportData(){const blob=new Blob([JSON.stringify({app:'poolyar',version:1,transactions:state.transactions,budgets:state.budgets},null,2)],{type:'application/json'});const filename=`poolyar-backup-${today()}.json`;if(window.PoolYarAndroid&&window.PoolYarAndroid.saveFile){const reader=new FileReader();reader.onload=()=>window.PoolYarAndroid.saveFile(filename,'application/json',String(reader.result).split(',')[1]);reader.readAsDataURL(blob)}else{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}toast('نسخه پشتیبان آماده شد.')}
function doImport(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.transactions)||!d.budgets||typeof d.budgets!=='object')throw Error();if(!confirm('اطلاعات فعلی با اطلاعات فایل جایگزین شود؟'))return;state.transactions=d.transactions;state.budgets=d.budgets;save();render();toast('اطلاعات بازیابی شد.')}catch(e){toast('فایل پشتیبان معتبر نیست.')}};r.readAsText(file)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;render();return}if(b.dataset.action){const a=b.dataset.action;if(a==='add-expense')addTx('expense');if(a==='add-income')addTx('income');if(a==='add-budget')addBudget();if(a==='close')closeModal();if(a==='export')exportData();if(a==='import')$('#importfile').click();if(a==='clear'&&confirm('همه تراکنش‌ها و بودجه‌ها برای همیشه حذف شوند؟')){state.transactions=[];state.budgets={};save();render();toast('اطلاعات پاک شد.')}return}if(b.dataset.settype){addTx(b.dataset.settype);return}if(b.dataset.filter){state.filter=b.dataset.filter;render();return}if(b.dataset.delete){const t=state.transactions.find(t=>String(t.id)===b.dataset.delete);if(t&&confirm(`تراکنش «${t.title}» حذف شود؟`)){state.transactions=state.transactions.filter(x=>x.id!==t.id);save();render();toast('تراکنش حذف شد.')}return}if(b.dataset.editBudget){addBudget(b.dataset.editBudget);return}if(b.dataset.removeBudget){delete state.budgets[b.dataset.removeBudget];save();render();toast('بودجه حذف شد.')}});
document.addEventListener('submit',e=>{if(e.target.id==='txform'){e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<=0){toast('مبلغ معتبر وارد کن.');return}state.transactions.push({id:Date.now()+Math.random(),title:String(f.get('title')).trim(),amount:Math.round(amount),category:String(f.get('category')),type:state.type,date:String(f.get('date')),created:Date.now()});save();closeModal();render();toast('تراکنش با موفقیت ثبت شد.')}if(e.target.id==='budgetform'){e.preventDefault();const f=new FormData(e.target),amount=Number(f.get('amount'));if(amount<=0)return;state.budgets[String(f.get('category'))]=Math.round(amount);save();closeModal();render();toast('بودجه ذخیره شد.')}});
document.addEventListener('change',e=>{if(e.target.id==='monthpick'){state.month=e.target.value||today().slice(0,7);save();render()}if(e.target.id==='importfile')doImport(e.target.files[0])});
$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
render();
})();
</script>
</body></html>
